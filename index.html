<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090c0f">
<meta name="tiksi-storage" content="portable">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="application-name" content="Tiksi">
<title>tiksi - design console</title>
<meta name="description" content="tiksi: an open, local-first design console for renovation and construction programs. Floorplans to 3D models to budgets, schedules and cut sheets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1013'/%3E%3Cpath d='M7 25h18v-4H7zM10 18h12v-4H10zM13 11h6V7h-6z' fill='%23e8973a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/console.css">
<link rel="stylesheet" href="./css/viewer.css">
<link rel="stylesheet" href="./css/materials.css">
<link rel="stylesheet" href="./css/photos.css">
<link rel="stylesheet" href="./css/reconstruction.css">
<link rel="stylesheet" href="./css/research.css">
<link rel="stylesheet" href="./css/guide.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/",
    "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" title="tiksi: foundation, origin, base">
      <svg class="brand-logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <path d="M7 25h18v-4H7zM10 18h12v-4H10zM13 11h6V7h-6z" fill="currentColor"/>
      </svg>
      <span class="brand-mark">TIKSI</span>
      <span class="brand-sub">design console</span>
    </div>
    <div class="topbar-group">
      <label class="tb-label" for="property-select">PROPERTY</label>
      <select id="property-select" class="tb-select"></select>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-group">
      <button id="btn-file" class="tb-btn" title="Open, import, save, 3D exchange and settings">FILE</button>
      <a href="#/guide" class="tb-btn guide-entry" title="User guide, screenshots and feature walkthroughs">GUIDE</a>
      <div id="edit-history" class="history-actions" role="group" aria-label="Undo and redo" hidden>
        <button id="btn-undo" class="tb-btn" data-act="undo" aria-label="Undo" disabled>UNDO</button>
        <button id="btn-redo" class="tb-btn" data-act="redo" aria-label="Redo" disabled>REDO</button>
      </div>
      <span id="save-status" class="save-status">SAVED</span>
    </div>
  </header>
  <nav id="rail" aria-label="Views">
    <a href="#/plan" data-view="plan">PLAN</a>
    <a href="#/model" data-view="model">MODEL</a>
    <a href="#/materials" data-view="materials">MATERIALS</a>
    <a href="#/photos" data-view="photos">PHOTOS</a>
    <a href="#/reconstruct" data-view="reconstruct">PHOTO TO 3D</a>
    <a href="#/research" data-view="research">SOURCING</a>
    <a href="#/projects" data-view="projects">PROJECTS</a>
    <a href="#/products" data-view="products">PRODUCTS</a>
    <a href="#/budget" data-view="budget">BUDGET</a>
    <a href="#/schedule" data-view="schedule">SCHEDULE</a>
    <a href="#/sheets" data-view="sheets">CUT SHEETS</a>
    <div class="rail-foot">
      <a href="https://github.com/MattaDurham/tiksi" target="_blank" rel="noopener">GITHUB</a>
    </div>
  </nav>
  <main id="view"></main>
</div>
<div id="print-root"></div>
<script type="module" src="./js/icons.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
