name: Checks
# TEMPORARY PROBE, do not merge: runs the click-through check on Linux to see what keeps MODEL busy.
on:
  pull_request:
jobs:
  probe:
    name: Probe (${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/fixture-room.mjs
      - run: E2E_APP_PORT=18765 E2E_MOCK_PORT=18766 node tools/e2e-functionality.mjs 2>&1 | grep -E "route checked|did not settle|passed|Error" | cut -c1-1500
