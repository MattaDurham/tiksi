name: Checks
# One run per change: a branch is tested through its pull request, and main is tested after a
# merge lands. Listing codex/** under push as well ran every PR branch twice per push (the push
# and pull_request runs use different concurrency groups), doubling CI time and the chance that
# one slow run blocks a landing, since the merge gate needs every run green.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The full preflight (every browser e2e suite) takes 14-16 minutes on hosted runners, so a
    # 15-minute cap cut passing runs off. 25 minutes leaves room to grow and still stops a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run preflight
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-artifacts-${{ matrix.os }}
          path: |
            tools/fixtures/**/*.png
            test-results/
          if-no-files-found: ignore
