name: Checks
# TEMPORARY PROBE, do not merge: compares a page reload with closing the page and opening a new one.
on:
  pull_request:
jobs:
  probe:
    name: Probe (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [reload, reopen]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/fixture-room.mjs
      - run: |
          for i in 1 2 3 4 5; do
            FIELD_RELOAD_MODE=${{ matrix.mode }} node tools/e2e-field-view.mjs > out.log 2>&1; code=$?
            echo "round $i exit $code $(grep PROBE out.log | tr '\n' ' ')"
          done
